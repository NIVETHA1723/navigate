<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixed Navigation Menu</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* Fixed Navigation Bar */
    #navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: transparent;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      padding: 15px 0;
      z-index: 1000;
    }

    /* Add style when scrolled */
    #navbar.scrolled {
      background-color: #333;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .nav-menu {
      list-style: none;
      display: flex;
      justify-content: center;
    }

    .nav-menu li {
      margin: 0 20px;
    }

    .nav-menu a {
      color: black;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.3s, background-color 0.3s;
      padding: 8px 12px;
      border-radius: 4px;
    }

    /* Hover Effects */
    .nav-menu a:hover {
      background-color: #555;
      color: #ffd700;
    }

    /* Style for scrolled navbar links */
    #navbar.scrolled .nav-menu a {
      color: white;
    }

    /* Dummy section for scroll */
    section {
      padding-top: 100px;
    }

    section h1 {
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>
<body>

  <!-- Navigation Menu -->
  <nav id="navbar">
    <ul class="nav-menu">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Dummy Content -->
  <section id="home">
    <h1>Welcome to Home</h1>
    <p style="text-align:center; padding: 20px;">Scroll down to see the navbar effect.</p>
  </section>

  <section id="about" style="height: 800px;">
    <h1>About Us</h1>
  </section>

  <section id="services" style="height: 800px;">
    <h1>Our Services</h1>
  </section>

  <section id="contact" style="height: 800px;">
    <h1>Contact Us</h1>
  </section>

  <!-- JavaScript -->
  <script>
    // Change navbar style on scroll
    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('navbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
